<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="transitions.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e7a4e">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%230f8a56%22/%3E%3Cstop offset=%221%22 stop-color=%22%233cc878%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22url(%23g)%22/%3E%3Cg fill=%22none%22 stroke=%22%23fff%22 stroke-width=%225.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M21 9 L12 18 L21 27%22/%3E%3Cpath d=%22M43 9 L52 18 L43 27%22/%3E%3Cpath d=%22M36 7.5 L28 28.5%22/%3E%3C/g%3E%3Cpath fill=%22%23fff%22 d=%22M6 40 C13 40 18 36 24 36 H58 V44 H48 C48 48 45 51 42 52 V54 H50 V59 H14 V54 H22 V52 C19 51 16 48 16 44 H14 C10 44 7 42 6 40 Z%22/%3E%3C/svg%3E">
<title>Your dashboard — Codewright Guild</title>
<script>(function(){
  try {
    var s = localStorage.getItem('cw-theme');
    var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
  } catch(e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
  document.documentElement.classList.add('js');
})();
</script>
<style>/* ═════════════ DESIGN TOKENS ═════════════ */
:root{
  --ink:#0d1f17; --ink-soft:#26382f;
  --paper:#f8fbf9; --paper-2:#eef5f0;
  --muted:#5f7368; --line:#dbe8e0;
  --accent:#0e7a4e; --accent-hover:#0a6340; --accent-soft:#dff3e7;
  --accent-2:#169a5f; --accent-3:#2fb06c; --amber:#2fb06c; --bad:#c2410c; --bad-soft:#fbe9e1;
  --grad:linear-gradient(115deg,#0a6b45 0%,#0e7a4e 34%,#169a5f 68%,#2fb06c 100%);
  --on-accent:#fff;
  --card-bg:#ffffff;
  --shadow:0 16px 38px -16px rgba(13,31,23,.20);
  --glow:0 18px 46px -14px rgba(14,122,78,.38);
  --spot:rgba(14,122,78,.10);
  --nav-bg:rgba(248,251,249,.80);
  --blob-op:.20;
  --ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme="dark"]{
  --ink:#ecf6f0; --ink-soft:#c6d8cd;
  --paper:#07120d; --paper-2:#0b1a13;
  --muted:#86a093; --line:#183024;
  --accent:#3ddc84; --accent-hover:#7aeaa8; --accent-soft:#0c2a1b;
  --accent-2:#5fe39a; --accent-3:#8bedb7; --amber:#8bedb7; --bad:#fb923c; --bad-soft:#2a1710;
  --grad:linear-gradient(115deg,#22c55e 0%,#3ddc84 34%,#5fe39a 68%,#8bedb7 100%);
  --on-accent:#04110a;
  --card-bg:#0d1a13;
  --shadow:0 18px 44px -16px rgba(2,12,7,.80);
  --glow:0 18px 54px -14px rgba(61,220,132,.40);
  --spot:rgba(61,220,132,.15);
  --nav-bg:rgba(7,18,13,.72);
  --blob-op:.30;
}


*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .35s ease,color .35s ease;
  animation:pageIn .6s var(--ease) both;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:6px}
::selection{background:var(--accent);color:var(--on-accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ═════════════ KEYFRAMES ═════════════ */
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes flow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,40px) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-30px) scale(.9)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,50px) scale(1.08)}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 var(--accent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes borderflow{to{background-position:200% 50%}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 10px 28px -10px color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 14px 38px -8px color-mix(in srgb,var(--accent-2) 65%,transparent)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}


/* ═════════════ NAV ═════════════ */
nav{position:sticky;top:0;z-index:50;background:var(--nav-bg);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);transition:background-color .35s ease,border-color .35s ease}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:70px;gap:20px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px;letter-spacing:-.01em;text-decoration:none}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--grad);background-size:200% 200%;
  color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:800;letter-spacing:.02em;
  font-family:"Iowan Old Style",Georgia,serif;animation:sheen 8s ease-in-out infinite;
  transition:transform .4s var(--ease)}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.08)}
.logo-img{display:block;flex:none;width:40px;height:40px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%230f8a56%22/%3E%3Cstop offset=%221%22 stop-color=%22%233cc878%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22url(%23g)%22/%3E%3Cg fill=%22none%22 stroke=%22%23fff%22 stroke-width=%225.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M21 9 L12 18 L21 27%22/%3E%3Cpath d=%22M43 9 L52 18 L43 27%22/%3E%3Cpath d=%22M36 7.5 L28 28.5%22/%3E%3C/g%3E%3Cpath fill=%22%23fff%22 d=%22M6 40 C13 40 18 36 24 36 H58 V44 H48 C48 48 45 51 42 52 V54 H50 V59 H14 V54 H22 V52 C19 51 16 48 16 44 H14 C10 44 7 42 6 40 Z%22/%3E%3C/svg%3E") center/contain no-repeat;transition:transform .4s var(--ease)}
.logo:hover .logo-img{transform:rotate(-6deg) scale(1.06)}
.foot-brand .logo-img{width:52px;height:52px}
.nav-right{display:flex;align-items:center;gap:22px}
.nav-links{display:flex;gap:30px;align-items:center}
.nav-links a{position:relative;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;transition:color .15s;padding:4px 0}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;
  background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav-links a:hover{color:var(--ink)}
.nav-links a:hover::after{transform:scaleX(1)}
.theme-toggle{background:transparent;color:var(--ink);border:1px solid var(--line);width:36px;height:36px;
  border-radius:10px;display:grid;place-items:center;cursor:pointer;transition:all .25s var(--ease);padding:0}
.theme-toggle:hover{border-color:var(--accent);transform:translateY(-1px) rotate(12deg)}
.theme-toggle svg{width:16px;height:16px;display:none}
[data-theme="light"] .theme-toggle .ico-moon{display:block}
[data-theme="dark"]  .theme-toggle .ico-sun {display:block}

/* ═════════════ BUTTONS ═════════════ */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 24px;border-radius:11px;font-weight:600;font-size:14.5px;text-decoration:none;
  border:1px solid transparent;cursor:pointer;font-family:inherit;
  transition:transform .2s var(--ease),box-shadow .25s ease,border-color .2s,background-position .6s var(--ease)}
.btn .arr{display:inline-block;transition:transform .25s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-primary{background:var(--grad);background-size:200% 100%;color:var(--on-accent);box-shadow:0 8px 22px -10px color-mix(in srgb,var(--accent) 55%,transparent)}
.btn-primary::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-120%) skewX(-20deg)}
.btn-primary:hover{background-position:100% 0;transform:translateY(-2px);box-shadow:var(--glow)}
.btn-primary:hover::after{animation:shine .8s var(--ease)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.btn[disabled]{opacity:.7;cursor:progress}



.dash{padding:52px 0 110px}
.dash-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dash-head .grow{flex:1;min-width:220px}
.avatar{width:66px;height:66px;border-radius:50%;background:var(--grad);color:var(--on-accent);display:grid;place-items:center;
  font:700 27px/1 "Iowan Old Style",Georgia,serif;overflow:hidden;border:1px solid var(--line);flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1.hello{font-family:"Iowan Old Style",Georgia,serif;font-size:clamp(30px,4.4vw,48px);font-weight:600;letter-spacing:-.02em;line-height:1.08;margin-bottom:4px}
.who-mail{color:var(--muted);font-size:14.5px;word-break:break-all}
.ledger{display:flex;flex-wrap:wrap;gap:6px 30px;margin:26px 0 46px;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}
.ledger b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 18px;flex-wrap:wrap}
.sec-h h2{font-family:"Iowan Old Style",Georgia,serif;font-size:25px;font-weight:600;letter-spacing:-.012em}
.sec-h p{color:var(--muted);font-size:14px}
.owned{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:58px}
.own{display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:0;overflow:hidden;
  background:var(--card-bg);border:1px solid var(--line);border-radius:18px;
  transition:transform .25s var(--ease),border-color .2s,box-shadow .3s}
.own:hover,.own:focus-visible{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:var(--shadow)}
.own-media{aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden;position:relative;
  background:linear-gradient(135deg,var(--accent-soft),var(--paper-2))}
.own-media .aegis-logo{font-size:172px}
.own-body{padding:18px 20px 20px;display:grid;gap:6px}
.own-body h3{font-family:"Iowan Old Style",Georgia,serif;font-size:21px;font-weight:600;letter-spacing:-.012em}
.own-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:13.5px}
.pill{font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--bad-soft);color:var(--bad)}
.panel{border:1px dashed color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:20px;padding:42px 28px;text-align:center;margin-bottom:58px;
  background:linear-gradient(135deg,var(--accent-soft),transparent 70%)}
.panel h2{font-family:"Iowan Old Style",Georgia,serif;font-size:26px;font-weight:600;letter-spacing:-.015em;margin-bottom:8px}
.panel p{color:var(--muted);max-width:46ch;margin:0 auto 22px;font-size:15.5px}
.panel .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.perks{display:grid;gap:0;margin-bottom:58px;border:1px solid var(--line);border-radius:16px;background:var(--card-bg);overflow:hidden}
.perk{display:flex;justify-content:space-between;gap:16px;padding:14px 20px;border-top:1px solid var(--line);font-size:14.5px;flex-wrap:wrap}
.perk:first-child{border-top:0}
.perk span:first-child{color:var(--muted)}
.perk span:last-child{font-weight:600;word-break:break-word}
.perk-empty{padding:22px 20px;color:var(--muted);font-size:14.5px}
.more{display:grid;gap:14px}
.more-item{display:flex;align-items:center;gap:18px;padding:16px 20px;border:1px solid var(--line);border-radius:16px;background:var(--card-bg);text-decoration:none;
  transition:border-color .2s,transform .25s var(--ease),box-shadow .3s}
.more-item:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));transform:translateY(-2px);box-shadow:var(--shadow)}
.more-item .aegis-logo{font-size:84px}
.more-item b{display:block;font-family:"Iowan Old Style",Georgia,serif;font-size:19px;font-weight:600}
.more-item span.d{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.more-item .go{margin-left:auto;color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}
.sk{border-radius:18px;min-height:250px;border:1px solid var(--line);
  background:linear-gradient(100deg,var(--paper-2) 30%,color-mix(in srgb,var(--accent) 9%,var(--paper-2)) 50%,var(--paper-2) 70%);background-size:200% 100%;animation:skl 1.4s linear infinite}
@keyframes skl{to{background-position:-200% 0}}
dialog.dlg{margin:auto;padding:0;border:1px solid var(--line);border-radius:20px;background:var(--card-bg);color:var(--ink);width:min(460px,94vw);box-shadow:var(--shadow)}
dialog.dlg::backdrop{background:rgba(2,10,6,.62);backdrop-filter:blur(6px)}
.dlg-body{padding:30px 28px 26px;position:relative}
.dlg-x{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.dlg-x:hover{color:var(--ink);border-color:var(--accent)}
.dlg h3{font-family:"Iowan Old Style",Georgia,serif;font-size:24px;font-weight:600;margin:6px 0 14px;padding-right:36px}
.dlg dl{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;font-size:14.5px;margin-bottom:18px}
.dlg dt{color:var(--muted)}.dlg dd{margin:0;word-break:break-all}
.dlg .soon{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);font-size:13.5px;text-align:center;margin-bottom:18px}
.dlg-logo{display:grid;place-items:center}
.dlg-logo .aegis-logo{font-size:120px}
@media (max-width:760px){.nav-links{display:none}.dash{padding-top:34px}.more-item{flex-wrap:wrap}.more-item .go{margin-left:0}}

/* ═════════════ AEGIS PLAN VIEW ═════════════ */
.tchip{display:inline-flex;align-items:center;gap:7px;font-weight:650;color:var(--ink)}
.tchip i{width:9px;height:9px;border-radius:3px;background:var(--c,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--accent)) 22%,transparent);transform:rotate(45deg)}
.agd-back{background:none;border:0;color:var(--muted);cursor:pointer;font:600 14px/1 inherit;font-family:inherit;padding:6px 0;margin:0 0 18px;transition:color .2s,transform .25s var(--ease)}
.agd-back:hover{color:var(--accent);transform:translateX(-3px)}
.agd-hero{position:relative;overflow:hidden;border-radius:24px;border:1px solid color-mix(in srgb,var(--c) 38%,#1b2a24);background:#05090b;color:#eef2f7;
  display:flex;align-items:center;gap:clamp(18px,4vw,56px);padding:clamp(22px,4vw,46px);margin-bottom:34px;
  --accent:var(--c);--accent-3:color-mix(in srgb,var(--c) 60%,#fff);--on-accent:#04110a;
  box-shadow:0 26px 70px -30px color-mix(in srgb,var(--c) 55%,transparent)}
.agd-hero>*:not(canvas){position:relative;z-index:1}
.agd-logo-wrap{flex:none;line-height:0;filter:drop-shadow(0 20px 40px rgba(0,0,0,.55))}
.agd-logo-wrap .aegis-logo{font-size:clamp(170px,24vw,280px)}
.agd-title small{display:block;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c);font-weight:700;margin-bottom:8px}
.agd-title h1{font-family:"Iowan Old Style",Georgia,serif;font-size:clamp(32px,5vw,54px);font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-bottom:14px}
.agd-badges{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.agd-tier{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:99px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:#fff;font-weight:700;font-size:15px}
.agd-tier i{width:10px;height:10px;border-radius:3px;background:var(--c);transform:rotate(45deg);box-shadow:0 0 14px var(--c)}
.agd-hero .pill{background:rgba(255,255,255,.1);color:#d6f5e6}
.agd-hero .pill.warn{background:rgba(251,146,60,.18);color:#fdba74}
.agd-tag{color:#b8c4bd;font-size:15.5px;max-width:42ch}
.agd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:46px}
.agd-perk{border:1px solid var(--line);border-radius:16px;background:var(--card-bg);padding:18px 20px;position:relative;overflow:hidden;transition:transform .25s var(--ease),border-color .2s,box-shadow .3s}
.agd-perk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.agd-perk:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 50%,var(--line));box-shadow:var(--shadow)}
.agd-perk span{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.agd-perk b{display:block;font-family:"Iowan Old Style",Georgia,serif;font-size:26px;font-weight:600;letter-spacing:-.01em}
.agd-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-bottom:46px;align-items:start}
.agd-box{border:1px solid var(--line);border-radius:18px;background:var(--card-bg);padding:6px 22px}
.agd-box h3{font-family:"Iowan Old Style",Georgia,serif;font-size:19px;font-weight:600;padding:16px 0 6px}
.agd-list{list-style:none;margin:0;padding:0 0 10px}
.agd-list li{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.agd-list li:first-child{border-top:0}
.agd-list .ic{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;transform:translateY(3px)}
.agd-list .on .ic{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.agd-list .off{color:var(--muted)}
.agd-list .off .ic{background:var(--paper-2);color:var(--muted)}
.agd-list .dt{margin-left:auto;color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
.agd-list .off .dt{white-space:normal}
.agd-meta{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;font-size:14.5px;padding:8px 0 16px}
.agd-meta dt{color:var(--muted)}.agd-meta dd{margin:0;word-break:break-all}
.agd-lic{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.agd-lic code{flex:1;min-width:200px;padding:11px 14px;border-radius:11px;background:var(--paper-2);border:1px solid var(--line);font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;word-break:break-all}
.agd-lic .btn{padding:10px 16px;font-size:13.5px}
.agd-up{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:18px;border:1px dashed color-mix(in srgb,var(--c) 55%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,transparent),transparent 70%);margin-bottom:46px}
.agd-up p{color:var(--muted);font-size:14.5px;max-width:54ch}.agd-up p b{color:var(--ink)}
.agd-enter>*{animation:rise .55s var(--ease) both}
.agd-enter>*:nth-child(2){animation-delay:.06s}.agd-enter>*:nth-child(3){animation-delay:.12s}.agd-enter>*:nth-child(4){animation-delay:.18s}.agd-enter>*:nth-child(5){animation-delay:.24s}
@media (max-width:760px){.agd-hero{flex-direction:column;text-align:center}.agd-badges{justify-content:center}.agd-tag{margin:0 auto}}
@media (prefers-reduced-motion:reduce){.agd-enter>*{animation:none}}

/* ═════════════ REDUCED MOTION ═════════════ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .js [data-reveal]{opacity:1 !important;translate:none !important}
  .card{transform:none !important}
}
a.card-media{text-decoration:none}

.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

</style>
</head>
<body>
<nav><div class="wrap nav-inner">
  <a href="index.html" class="logo"><span class="logo-img" role="img" aria-label="Codewright Guild logo"></span><span>Codewright Guild</span></a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="index.html#catalogue">Catalogue</a>
      <a href="dashboard.html" aria-current="page" style="color:var(--ink)">Dashboard</a>
      <a href="index.html#contact">Contact</a>
    </div>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle colour theme">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
</div></nav>

<main class="dash"><div class="wrap" id="app" aria-live="polite"><div class="sk" style="min-height:120px"></div></div></main>
<script src="tunnels.js"></script>
<script src="aegis-data.js"></script>
<script src="bedrock-bg.js"></script>
<script>
(function(){
  'use strict';
  window.CW_NO_PROFILE_ON_LOGIN = true;     /* auth.js: don't pop the profile dialog after sign-in, this page IS the profile */
  var KEY = 'cw-account';
  /* Every product in the catalogue. 'key' is matched (lower-case, letters+digits only) against the product name the server returns. */
  var CATALOGUE = [
    { key: 'aegis', name: 'Aegis-Anti-Cheat', url: 'aegis-anti-cheat.html', logo: 'aegis',
      blurb: 'Keep your game fair. Spots combat cheats like KillAura and TriggerBot.' }
  ];
  var root = document.getElementById('app');
  var state = { sess: null, data: null, err: '', loading: false, ticket: 0, view: null, bg: null };

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function acct(){ try { var a = JSON.parse(localStorage.getItem(KEY) || 'null'); return a && a.session ? a : null; } catch (e) { return null; } }
  function norm(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function find(name){ var n = norm(name); for (var i = 0; i < CATALOGUE.length; i++) if (n.indexOf(CATALOGUE[i].key) > -1) return CATALOGUE[i]; return null; }
  function fmtDate(d){
    if (!d) return '';
    var t = new Date(d); if (isNaN(t)) return String(d);
    try { return new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric' }).format(t); } catch (e) { return t.toDateString(); }
  }
  function normalise(p){
    return { product: p.product || p.name || 'Product', tier: p.tier || p.plan || '', date: p.date || p.purchased_at || p.created || '',
             order: p.order || p.order_id || p.id || '', amount: p.amount || '', status: p.status || 'paid',
             licence: p.licence || p.license || p.licence_key || p.key || '' };
  }
  function tierDef(x){ return window.AegisData && /aegis/i.test(x.product) ? window.AegisData.tier(x.tier) : null; }
  function tierChip(x){
    if (!x.tier) return 'Purchased';
    var t = tierDef(x);
    return '<span class="tchip"' + (t ? ' style="--c:' + t.def.color + '"' : '') + '><i></i>' + esc(x.tier) + ' tier</span>';
  }
  function logoHtml(item){ return item && item.logo === 'aegis' ? '<span class="aegis-logo" role="img" aria-label="' + esc(item.name) + ' logo"></span>' : '<span class="avatar" style="border-radius:16px">' + esc((item ? item.name : '?').charAt(0)) + '</span>'; }
  function initLogos(){ if (window.AegisLogo) window.AegisLogo.init(); }

  function api(path){
    return Tunnels.fetch('perks', path, { credential: state.sess.session });
  }

  function load(){
    var t = ++state.ticket; state.loading = true; state.err = ''; state.data = null; draw();
    api('/api/purchases').then(function (r) {
      if (r.status === 401) { var e = new Error('expired'); e.expired = true; throw e; }
      if (r.status === 404) return { purchases: [] };
      if (!r.ok) throw new Error('server ' + r.status);
      return r.json();
    }).then(function (o) {
      return api('/api/perks').then(function (r) { return r.ok ? r.json() : { perks: [] }; }, function () { return { perks: [] }; })
        .then(function (k) { return { purchases: (o.purchases || []).map(normalise).reverse(), perks: (k && k.perks) || [] }; });
    }).then(function (d) {
      if (t !== state.ticket) return;
      state.data = d; state.loading = false; draw();
    }).catch(function (e) {
      if (t !== state.ticket) return;
      state.loading = false;
      if (e && e.expired) { signOut(); state.err = 'expired'; }
      else state.err = 'offline';
      draw();
    });
  }

  function signOut(){
    if (window.CWAuth) window.CWAuth.signOut(); else { try { localStorage.removeItem(KEY); } catch (e) {} }
    state.sess = null; state.data = null; state.view = null;
  }
  function click(sel){ var b = document.querySelector(sel); if (b) b.click(); }

  /* ---------- drawing ---------- */
  function draw(){
    if (state.bg) { state.bg.destroy(); state.bg = null; }
    var a = state.sess;
    if (!a) {
      root.innerHTML =
        '<div class="panel"><h2>' + (state.err === 'expired' ? 'Your session expired' : 'Sign in to see your products') + '</h2>' +
        '<p>' + (state.err === 'expired' ? 'Log in again to pick up where you left off.' : 'Your dashboard lists every Codewright Guild product you own, with its tier and order details.') + '</p>' +
        '<div class="row"><button class="btn btn-primary" type="button" data-act="login">Log in</button>' +
        '<button class="btn btn-ghost" type="button" data-act="signup">Create account</button></div></div>' +
        moreSection([]);
      initLogos(); return;
    }
    var name = (a.name || '').trim().split(/\s+/)[0] || String(a.email || '').split('@')[0] || 'there';
    var av = a.picture ? '<img src="' + esc(a.picture) + '" alt="" referrerpolicy="no-referrer">' : esc(name.charAt(0).toUpperCase());
    var head = '<div class="dash-head"><span class="avatar">' + av + '</span><div class="grow"><h1 class="hello">Welcome back, ' + esc(name) + '</h1>' +
      '<div class="who-mail">' + esc(a.email) + '</div></div><a class="btn btn-ghost" href="index.html#catalogue">Browse the catalogue</a></div>';

    if (state.loading) {
      root.innerHTML = head + '<div class="ledger"><span>Loading your account&hellip;</span></div><div class="owned"><div class="sk"></div><div class="sk"></div></div>';
      return;
    }
    if (state.err === 'offline') {
      root.innerHTML = head + '<div class="panel" style="margin-top:34px"><h2>Can&rsquo;t reach the Codewright server</h2>' +
        '<p>It may be offline for a moment. Try again in a minute.</p><div class="row"><button class="btn btn-primary" type="button" data-act="retry">Try again</button></div></div>';
      return;
    }
    if (state.view != null && state.data && state.data.purchases[state.view]) { drawDetail(state.data.purchases[state.view]); return; }
    var d = state.data || { purchases: [], perks: [] }, list = d.purchases;
    var last = list.length ? fmtDate(list[0].date) : '';
    var ledger = '<div class="ledger"><span><b>' + list.length + '</b> ' + (list.length === 1 ? 'product' : 'products') + ' owned</span>' +
      (last ? '<span>Latest purchase <b>' + esc(last) + '</b></span>' : '') +
      '<span><b>' + d.perks.length + '</b> ' + (d.perks.length === 1 ? 'perk' : 'perks') + ' on your account</span></div>';

    var owned;
    if (list.length) {
      owned = '<div class="sec-h"><h2>Your products</h2></div><div class="owned">' + list.map(function (x, i) {
        var item = find(x.product), bad = /fail|refund|cancel|dispute/i.test(x.status);
        return '<button class="own" type="button" data-i="' + i + '"><span class="own-media">' + logoHtml(item) + '</span>' +
          '<span class="own-body"><h3>' + esc(item ? item.name : x.product) + '</h3><span class="own-meta"><span>' +
          tierChip(x) + (x.date ? ' &middot; ' + esc(fmtDate(x.date)) : '') + '</span>' +
          '<span class="pill' + (bad ? ' warn' : '') + '">' + esc(x.status) + '</span></span></span></button>';
      }).join('') + '</div>';
    } else {
      owned = '<div class="panel"><h2>You don&rsquo;t own any products yet</h2><p>Products you buy appear here automatically. Have a look at what the Guild builds.</p>' +
        '<div class="row"><a class="btn btn-primary" href="index.html#catalogue">Browse the catalogue <span class="arr">&rarr;</span></a></div></div>';
    }

    var ownedKeys = {}; list.forEach(function (x) { var c = find(x.product); if (c) ownedKeys[c.key] = 1; });
    var perks = '<div class="sec-h"><h2>Perks</h2></div><div class="perks">' + (d.perks.length ? d.perks.map(function (k) {
      return '<div class="perk"><span>' + esc(k.name) + '</span><span>' + esc(k.value) + '</span></div>';
    }).join('') : '<div class="perk-empty">No perks on your account yet.</div>') + '</div>';

    root.innerHTML = head + ledger + owned + perks + moreSection(Object.keys(ownedKeys));
    initLogos();
    if (state.view != null) state.view = null;
  }

  function moreSection(ownedKeys){
    var rest = CATALOGUE.filter(function (c) { return ownedKeys.indexOf(c.key) < 0; });
    if (!rest.length) return '';
    return '<div class="sec-h"><h2>' + (ownedKeys.length ? 'More from the Guild' : 'In the catalogue') + '</h2></div><div class="more">' + rest.map(function (c) {
      return '<a class="more-item" href="' + esc(c.url) + '">' + logoHtml(c) + '<span><b>' + esc(c.name) + '</b><span class="d">' + esc(c.blurb) + '</span></span><span class="go">View product &rarr;</span></a>';
    }).join('') + '</div>';
  }

  /* ---------- product view: tier, perks, features ---------- */
  function mask(k){ k = String(k); return k.length > 4 ? k.slice(0, -4).replace(/[A-Za-z0-9]/g, '\u2022') + k.slice(-4) : k; }

  function drawDetail(x){
    var item = find(x.product), t = tierDef(x), c = t ? t.def.color : '#34e0b8';
    var bad = /fail|refund|cancel|dispute/i.test(x.status);
    var h = '<div class="agd-enter">' +
      '<button class="agd-back" type="button" data-act="back">&larr; All products</button>' +
      '<section class="agd-hero" style="--c:' + c + '"><span class="agd-logo-wrap">' + logoHtml(item) + '</span>' +
      '<div class="agd-title"><small>Your plan</small><h1>' + esc(item ? item.name : x.product) + '</h1>' +
      '<div class="agd-badges">' +
      (x.tier ? '<span class="agd-tier"><i></i>' + esc(x.tier) + ' tier</span>' : '') +
      '<span class="pill' + (bad ? ' warn' : '') + '">' + esc(x.status) + '</span></div>' +
      (t ? '<p class="agd-tag">' + esc(t.def.tagline) + ' &middot; $' + t.def.price + ' plan</p>' : '') + '</div></section>';

    if (t) {
      h += '<div class="sec-h"><h2>Your perks</h2><p>What the ' + esc(t.def.name) + ' tier gives you</p></div><div class="agd-grid" style="--c:' + c + '">' +
        t.perks.map(function (p) { return '<div class="agd-perk"><span>' + esc(p.name) + '</span><b>' + esc(p.value) + '</b></div>'; }).join('') + '</div>';
    }

    h += '<div class="agd-cols" style="--c:' + c + '">';
    if (t) {
      h += '<div class="agd-box"><h3>Included in ' + esc(t.def.name) + '</h3><ul class="agd-list">' + t.features.yes.map(function (f) {
        return '<li class="on"><span class="ic">&#10003;</span><span>' + esc(f.label) + '</span>' + (f.detail ? '<span class="dt">' + esc(f.detail) + '</span>' : '') + '</li>';
      }).join('') + '</ul></div>';
      if (t.features.no.length) {
        h += '<div class="agd-box"><h3>Not on your tier</h3><ul class="agd-list">' + t.features.no.map(function (f) {
          var from = window.AegisData.tiers[f.firstTier];
          return '<li class="off"><span class="ic">&times;</span><span>' + esc(f.label) + '</span>' + (from ? '<span class="dt">from ' + esc(from.name) + '</span>' : '') + '</li>';
        }).join('') + '</ul></div>';
      }
    }
    h += '<div class="agd-box"><h3>Purchase details</h3><dl class="agd-meta">' +
      (x.tier ? '<dt>Tier</dt><dd>' + esc(x.tier) + '</dd>' : '') +
      (x.date ? '<dt>Purchased</dt><dd>' + esc(fmtDate(x.date)) + '</dd>' : '') +
      (x.amount ? '<dt>Paid</dt><dd>' + esc(x.amount) + '</dd>' : '') +
      (x.order ? '<dt>Order ID</dt><dd>' + esc(x.order) + '</dd>' : '') +
      '<dt>Status</dt><dd>' + esc(x.status) + '</dd></dl>' +
      (x.licence ? '<div class="agd-lic"><code id="agd-key" data-k="' + esc(x.licence) + '" data-hidden="1">' + esc(mask(x.licence)) + '</code>' +
        '<button class="btn btn-ghost" type="button" data-act="key-show">Reveal</button><button class="btn btn-ghost" type="button" data-act="key-copy">Copy</button></div>' : '') +
      '</div></div>';

    if (t && state.data && t.index < window.AegisData.tiers.length - 1) {
      var nx = window.AegisData.tiers[t.index + 1];
      h += '<div class="agd-up" style="--c:' + nx.color + '"><p><b>Need more?</b> ' + esc(nx.name) + ' (' + esc(nx.tagline.toLowerCase()) + ') unlocks more servers, faster verdicts and extra tools.</p>' +
        '<a class="btn btn-primary" href="' + (item ? esc(item.url) : 'index.html#catalogue') + '">Compare tiers <span class="arr">&rarr;</span></a></div>';
    }
    h += (item ? '<a class="btn btn-ghost" href="' + esc(item.url) + '">Open product page</a>' : '') + '</div>';

    root.innerHTML = h;
    initLogos();
    if (window.BedrockBG) state.bg = BedrockBG.mount(root.querySelector('.agd-hero'), { dim: .5, glow: c });
  }

  function showDetail(i, el){
    var from = el && el.querySelector ? el.querySelector('.aegis-logo') : null;
    function go(){ state.view = i; draw(); window.scrollTo(0, 0); }
    try { history.pushState({ v: i }, '', '#product'); } catch (e) {}
    if (window.CWTransition) CWTransition.run(go, { logo: from, logoAfter: function () { return document.querySelector('.agd-hero .aegis-logo'); } });
    else go();
  }
  function closeDetail(){
    var i = state.view, before = document.querySelector('.agd-hero .aegis-logo');
    function go(){ state.view = null; draw(); }
    if (window.CWTransition) CWTransition.run(go, { logo: before, logoAfter: function () { return document.querySelector('.own[data-i="' + i + '"] .aegis-logo'); } });
    else go();
  }
  window.addEventListener('popstate', function () { if (state.view != null) closeDetail(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.view != null) { if (location.hash === '#product') history.back(); else closeDetail(); } });

  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act],[data-i]') : null;
    if (!b) return;
    if (b.hasAttribute('data-i')) { showDetail(+b.getAttribute('data-i'), b); return; }
    var act = b.getAttribute('data-act');
    if (act === 'login') click('#cw-auth .cw-login');
    else if (act === 'signup') click('#cw-auth .cw-signup');
    else if (act === 'retry') load();
    else if (act === 'back') { if (location.hash === '#product') history.back(); else closeDetail(); }
    else if (act === 'key-show') {
      var k = document.getElementById('agd-key'); if (!k) return;
      var hid = k.getAttribute('data-hidden') === '1';
      k.textContent = hid ? k.getAttribute('data-k') : mask(k.getAttribute('data-k')); k.setAttribute('data-hidden', hid ? '0' : '1');
      b.textContent = hid ? 'Hide' : 'Reveal';
    }
    else if (act === 'key-copy') {
      var kk = document.getElementById('agd-key'); if (!kk) return;
      var txt = kk.getAttribute('data-k');
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1400); }, function () { b.textContent = 'Press Ctrl+C'; });
    }
  });

  /* ---------- keep in step with auth.js ---------- */
  function sync(){
    var a = acct();
    if (!a) { state.sess = null; state.data = null; state.loading = false; draw(); return; }
    if (!state.sess || state.sess.session !== a.session) { state.sess = a; state.err = ''; load(); }
    else { state.sess = a; draw(); }
  }
  window.addEventListener('cw-auth', sync);
  window.addEventListener('storage', function (e) { if (e.key === KEY) sync(); });
  document.addEventListener('DOMContentLoaded', sync);
  window.addEventListener('pageshow', function (e) { if (e.persisted) sync(); });
})();
</script>
<script src="aegis-logo.js" defer></script>
<script src="auth.js" defer></script>
<script>
/* theme toggle (same behaviour as the home page) */
document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-theme-toggle]') : null; if (!b) return;
  var r = document.documentElement, next = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  r.setAttribute('data-theme', next); try { localStorage.setItem('cw-theme', next); } catch (_) {}
});
</script>
</body>
