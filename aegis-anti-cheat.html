*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

.btn:hover{transform:translateY(-2px);border-color:#34e0b8;color:#34e0b8}

.btn.solid:hover{color:#05080b;border-color:#fff}

  for(var i=0;i<7;i++) R.push({y:.5+i*.035, a:.07+.02*(i%3), f:1.3+i*.17, s:.25+i*.05, p:i*1.1, th:.05+.012*i, al:.07+.025*(i%4)});
  function size(){ var r=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    c.width=W*r; c.height=H*r; x.setTransform(r,0,0,r,0,0); }
  function wy(r,u){ return H*r.y + H*r.a*Math.sin(u*3.1416*r.f + t*r.s + r.p) + H*r.a*.6*Math.cos(u*5*r.f*.5 - t*r.s*.7 + r.p*2); }
  function draw(){
    var k=(Math.sin(t*.15)+1)/2, a=Math.round(10+k*10), b=Math.round(24+k*14);
    var g=x.createLinearGradient(0,0,W*(.6+.4*k),H);
    g.addColorStop(0,'rgb('+a+','+a+','+(a+2)+')'); g.addColorStop(.5,'rgb('+b+','+b+','+(b+3)+')'); g.addColorStop(1,'rgb(3,3,4)');
    x.globalCompositeOperation='source-over'; x.fillStyle=g; x.fillRect(0,0,W,H);
    x.globalCompositeOperation='lighter';
    for(var i=0;i<R.length;i++){
      var r=R[i], fg=x.createLinearGradient(0,0,W,0), top=[], bot=[], step=8, u, y;
      fg.addColorStop(0,'rgba(220,226,236,0)'); fg.addColorStop(.5,'rgba(220,226,236,'+r.al+')'); fg.addColorStop(1,'rgba(220,226,236,0)');
      for(var px=0; px<=W+step; px+=step){ u=px/W; y=wy(r,u);
        top.push([px,y]); bot.push([px, y+H*r.th*(.6+.4*Math.sin(u*7.5+t*.4+r.p))]); }
      x.beginPath(); x.moveTo(top[0][0],top[0][1]);
      for(var j=1;j<top.length;j++) x.lineTo(top[j][0],top[j][1]);
      for(j=bot.length-1;j>=0;j--) x.lineTo(bot[j][0],bot[j][1]);
      x.closePath(); x.fillStyle=fg; x.fill();
      x.beginPath(); x.moveTo(top[0][0],top[0][1]);
      for(j=1;j<top.length;j++) x.lineTo(top[j][0],top[j][1]);
      x.strokeStyle='rgba(235,240,248,'+(r.al*2.2)+')'; x.lineWidth=1.2; x.stroke();
    }
  }
  function loop(ts){ t+=Math.min((ts-last)/1000,.05); last=ts; draw(); requestAnimationFrame(loop); }
  size(); addEventListener('resize',size);
  if(reduce){ t=2; draw(); return; }
  requestAnimationFrame(loop);
})();
</script>
