  function add(g,u,o,s,b,v){ P.push({g:g,u:u,u0:u,o:o,s:s,b:b,v:v,ph:R(0,6.28),x:R(0,1),y:R(0,1)}); }
  for(i=0;i<70;i++) add(0,Math.pow(Math.random(),1.6)*.2,R(.1,1.7),R(.5,1.3),R(.5,1),0);   /* sparkle cluster, lower left */
  for(i=0;i<14;i++) add(3,Math.pow(Math.random(),1.5)*.16,R(.2,1.5),R(3,6),R(.6,1),0);     /* soft bokeh dots */
  for(i=0;i<55;i++) add(1,Math.random(),R(-1.8,2.6),R(.4,1),R(.3,.8),R(.002,.006));        /* drifting specks along the ribbon */
  for(i=0;i<16;i++) add(2,0,0,R(.4,.9),R(.2,.5),0);                                         /* far-away specks */
  function cyf(u){ var d=u-.47, k=d<0?.88:.5;                       /* centre line: arches up, peaks near the middle */
    return h*(.37+k*d*d+.012*Math.sin(u*3.2-t*.35)+.008*Math.cos(u*5.1+t*.28)); }
  function hhf(u){ return h*(.038+.085*Math.pow(1-u,3)+.03*u*u)*(1+.1*Math.sin(u*4-t*.3)); }  /* thick on the left, thin on the right */
  function tau(u){ return .9*Math.sin(u*3-t*.22+.5)+.3*Math.sin(u*7+t*.15); }                /* twist: makes strands cross */
  function size(){
    w=Math.ceil(innerWidth*Q); h=Math.ceil(innerHeight*Q); c.width=w; c.height=h; n=Math.ceil(w/STEP)+2; C=new Float32Array(n); Hh=new Float32Array(n);
    Y=[]; for(var k=0;k<=K;k++) Y.push(new Float32Array(n));
    var col='rgba(215,219,226,';
    GF=x.createLinearGradient(0,0,w,0); GF.addColorStop(0,col+'1)'); GF.addColorStop(.45,col+'.62)'); GF.addColorStop(1,col+'.9)');
    BG=x.createLinearGradient(0,0,0,h); BG.addColorStop(0,'#000'); BG.addColorStop(.74,'#000'); BG.addColorStop(1,'#1a1a1a');
    GL=x.createRadialGradient(w*.035,h*.62,0,w*.035,h*.62,h*.22); GL.addColorStop(0,col+'.22)'); GL.addColorStop(1,col+'0)');
  }
  function strand(k){ x.beginPath(); x.moveTo(0,Y[k][0]); for(var j=1;j<n;j++) x.lineTo(j*STEP,Y[k][j]); x.stroke(); }
  function draw(dt){
    var j,k,u,cy,hh,tw;
    x.globalCompositeOperation='source-over'; x.globalAlpha=1; x.fillStyle=BG; x.fillRect(0,0,w,h);
    x.globalCompositeOperation='lighter';
    for(j=0;j<n;j++){ u=j*STEP/w; cy=cyf(u); hh=hhf(u); tw=tau(u); C[j]=cy; Hh[j]=hh;
      for(k=0;k<=K;k++) Y[k][j]=cy+hh*Math.cos(k*Math.PI/K+tw)+hh*.05*Math.sin(u*9+t*.4+k*1.7); }
    x.globalAlpha=.8+.2*Math.sin(t*.5); x.fillStyle=GL; x.fillRect(0,h*.3,w*.4,h*.6);
    /* glass body: 6 stacked translucent layers = smooth see-through gradient, brighter in the middle */
    x.fillStyle=GF; x.globalAlpha=.03;
    for(var l=0;l<6;l++){ var sc=1-l*.15;
      x.beginPath(); x.moveTo(0,C[0]-Hh[0]*sc);
      for(j=1;j<n;j++) x.lineTo(j*STEP,C[j]-Hh[j]*sc);
      for(j=n-1;j>=0;j--) x.lineTo(j*STEP,C[j]+Hh[j]*sc);
      x.closePath(); x.fill(); }
    /* soft strands: a wide faint glow + a thin faint core (no hard lines) */
    x.strokeStyle=GF;
    for(k=0;k<=K;k++){ var ed=(k===0||k===K);
      x.lineWidth=5; x.globalAlpha=ed?.05:.025; strand(k);
      x.lineWidth=1; x.globalAlpha=ed?(k===0?.26:.16):.07; strand(k); }
    x.fillStyle='#e6e9ef';
    for(i=0;i<P.length;i++){ var q=P[i], px, py, al=q.b*(.35+.65*(.5+.5*Math.sin(t*(.6+q.ph*.1)+q.ph)));
      if(q.g===2){ px=(q.x+.01*Math.sin(t*.1+q.ph))*w; py=(.05+q.y*.9)*h; }
      else { if(q.g===1){ q.u+=q.v*dt; if(q.u>1) q.u-=1; u=q.u; } else u=q.u0+.012*Math.sin(t*.3+q.ph);
        px=u*w; py=cyf(u)+q.o*(hhf(u)+h*.012); }
      x.beginPath();
      if(q.g===3){ x.globalAlpha=al*.16; x.arc(px,py,q.s,0,6.283); x.fill(); x.beginPath(); x.globalAlpha=al*.5; x.arc(px,py,.9,0,6.283); }
      else { x.globalAlpha=al; x.arc(px,py,q.s,0,6.283); }
      x.fill(); }
    x.globalAlpha=1;
  }
  function loop(ts){ var dt=Math.min((ts-last)/1000,.05); last=ts; t+=dt; draw(dt); requestAnimationFrame(loop); }
  size(); addEventListener('resize',size);
  if(reduce){ t=2; draw(0); return; }
  requestAnimationFrame(loop);
})();
</script>
</body></html>
