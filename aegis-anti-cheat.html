*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#eef2f7;

body::after{content:"";position:fixed;inset:0;pointer-events:none;

@keyframes sweep{0%,100%{background-position:100% 0}50%{background-position:0 0}}

nav a:hover{color:#fff}
main{position:relative;z-index:1;height:100%;display:flex;align-items:center;padding:0 clamp(24px,7vw,110px)}
.copy{max-width:560px}
.eyebrow{display:inline-block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:#34e0b8;

@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
p{font-size:19px;color:#8d97a5;margin-bottom:36px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 24px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;
  border:1px solid #2a323d;color:#eef2f7;transition:transform .25s,border-color .25s,color .25s}
.btn:hover{transform:translateY(-2px);border-color:#34e0b8;color:#34e0b8}
.btn.solid{background:#eef2f7;color:#05080b;border-color:#eef2f7;box-shadow:0 8px 28px -10px rgba(255,255,255,.35)}
.btn.solid:hover{color:#05080b;border-color:#fff}
@media (max-width:760px){main{align-items:flex-end;padding-bottom:12vh}#atom{opacity:.55}}

<script>
(function(){
  var c=document.getElementById('atom'), x=c.getContext('2d'), W=0,H=0,t=0,cx=0,cy=0,mx=0,my=0,tx=0,ty=0,last=0;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, N=4;
  function size(){var r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*r;c.height=H*r;
    x.setTransform(r,0,0,r,0,0);cx=W>760?W*.68:W/2;cy=W>760?H/2:H*.34;}
  function P(a,k,S){
    var px=Math.cos(a),py=Math.sin(a),th=k*Math.PI/N+t*.35,c1=Math.cos(th),s1=Math.sin(th);
    var x1=px*c1,z1=-px*s1;
    var ax=.55+.2*Math.sin(t*.3)+my*.5,c2=Math.cos(ax),s2=Math.sin(ax);
    var y2=py*c2-z1*s2,z2=py*s2+z1*c2;
    var az=t*.12+mx*.5,c3=Math.cos(az),s3=Math.sin(az);
    var x3=x1*c3-y2*s3,y3=x1*s3+y2*c3,f=1/(1-z2*.3);
    return{x:cx+x3*S*f,y:cy+y3*S*f,z:z2,f:f};}
  function pass(front,S){
    for(var k=0;k<N;k++){
      var p0=P(0,k,S);
      for(var i=1;i<=90;i++){var p1=P(i/90*6.2832,k,S);
        if((p1.z>=0)===front){x.strokeStyle='rgba(215,226,238,'+(front?.6:.16)+')';x.lineWidth=front?1.4:.8;
          x.beginPath();x.moveTo(p0.x,p0.y);x.lineTo(p1.x,p1.y);x.stroke();}
        p0=p1;}
      var e=P(t*(1.1+k*.3)+k*1.7,k,S);
      if((e.z>=0)===front){var r=(front?11:8)*e.f,g=x.createRadialGradient(e.x,e.y,0,e.x,e.y,r*2.4);
        g.addColorStop(0,'#fff');g.addColorStop(.25,'#34e0b8');g.addColorStop(1,'rgba(52,224,184,0)');
        x.fillStyle=g;x.beginPath();x.arc(e.x,e.y,r*2.4,0,6.2832);x.fill();}
    }}
  function draw(){
    x.clearRect(0,0,W,H);var S=Math.min(W,H)*.36;
    var h=x.createRadialGradient(cx,cy,0,cx,cy,S*1.5);
    h.addColorStop(0,'rgba(52,224,184,.14)');h.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=h;x.fillRect(0,0,W,H);
    pass(false,S);
    var n=S*.2*(1+.06*Math.sin(t*2)),g=x.createRadialGradient(cx,cy,0,cx,cy,n);
    g.addColorStop(0,'#fff');g.addColorStop(.3,'rgba(150,255,230,.9)');g.addColorStop(1,'rgba(52,224,184,0)');
    x.fillStyle=g;x.beginPath();x.arc(cx,cy,n,0,6.2832);x.fill();
    pass(true,S);}
  function loop(ts){var dt=Math.min((ts-last)/1000,.05);last=ts;t+=dt;
    mx+=(tx-mx)*.05;my+=(ty-my)*.05;draw();requestAnimationFrame(loop);}
  size();addEventListener('resize',size);
  addEventListener('pointermove',function(e){tx=e.clientX/W-.5;ty=e.clientY/H-.5;});
  if(reduce){t=1.2;draw();return;}
  requestAnimationFrame(loop);
})();
</script>
</body></html>
